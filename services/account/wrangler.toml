name = "pomelo-account"
main = "src/index.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "account.stuffbyren.xyz", custom_domain = true }]

[vars]
PUBLIC_URL = "https://account.stuffbyren.xyz"
ARTWORK_PUBLIC_URL = "https://account.stuffbyren.xyz"
GITHUB_REPOSITORY = "Nickname5415/Pomelo"

[[d1_databases]]
binding = "DB"
database_name = "pomelo-account"
database_id = "96eb2fa3-d1d3-4aa3-8b6c-3b6caf18668e"
migrations_dir = "migrations"

# Discord artwork lives at the root of B2. Set B2_KEY_ID and
# B2_APPLICATION_KEY as Worker secrets.



# Per-IP limit on sign-in and token requests.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "9999"
simple = { limit = 30, period = 60 }

# Per-account limit on Apple Music developer tokens.
[[ratelimits]]
name = "APPLE_LIMITER"
namespace_id = "9998"
simple = { limit = 5, period = 60 }

# Orchard Connect presence and signaling: one hub per account.
[[durable_objects.bindings]]
name = "CONNECT_HUB"
class_name = "ConnectHub"

[[migrations]]
tag = "connect-hub-v1"
new_sqlite_classes = ["ConnectHub"]

# Optional TURN relay for Connect (Cloudflare Realtime). Without these, Connect
# uses STUN only. `wrangler secret put TURN_KEY_ID` and `TURN_KEY_API_TOKEN`.

[triggers]
# Hourly purge, and the support sweep that pulls GitHub issue activity.
crons = ["17 * * * *", "*/10 * * * *"]

[ai]
binding = "AI"

[observability]
enabled = true

[observability.traces]
enabled = true
