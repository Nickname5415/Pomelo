apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def orchardReleaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
def orchardReleaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def orchardReleaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def orchardReleaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def orchardReleaseSigningReady = [orchardReleaseKeystore, orchardReleaseStorePassword, orchardReleaseKeyAlias, orchardReleaseKeyPassword].every { it }



// Declared here rather than read back off the android extension because two toolchains consume
// them and AGP no longer exposes the resolved NDK path to build scripts.
def orchardNdkVersion = '28.2.13676358'
def orchardMinSdk = 31
// Production installs are ARM64. x86_64 remains available in debug builds for the Android
// emulator, without making every distributed APK carry a second copy of each native library.
def orchardReleaseAbis = ['arm64-v8a']
def orchardDebugAbis = orchardReleaseAbis + ['x86_64']
// Both toolchains build every ABI that any build type can package.
def orchardAbis = orchardDebugAbis

// Where the NDK keeps its C++ runtime, per ABI. Needed because the transition engine links
// Signalsmith Stretch and cargo-ndk link the *shared* runtime, while AGP only packages
// libc++_shared.so on behalf of its small CMake resampler module. Without this nothing puts the
// runtime in the APK,
// and `System.loadLibrary("orchard_earmark")` fails at the first transition, which is silent: the
// engine reports itself unavailable and every mix comes out as the plain volume ramp.
def orchardStlTriples = ['arm64-v8a': 'aarch64-linux-android', 'x86_64': 'x86_64-linux-android']

def orchardNdkDir = {
    def fromEnvironment = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT')
    if (fromEnvironment) return file(fromEnvironment)
    def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    def properties = file('../local.properties')
    if (!sdk && properties.exists()) {
        def loaded = new Properties()
        properties.withInputStream { loaded.load(it) }
        sdk = loaded.getProperty('sdk.dir')
    }
    if (!sdk) {
        throw new GradleException(
            'Cannot locate the Android NDK: set ANDROID_NDK_HOME, or ANDROID_HOME with ' +
                "ndk/$orchardNdkVersion installed.")
    }
    return new File("$sdk/ndk/$orchardNdkVersion")
}

android {
    namespace = 'xyz.stuffbyren.pomelo'
    compileSdk = 37
    // Pinned because two toolchains agree on it: CMake builds the streaming resampler and
    // cargo-ndk builds Earmark, and a mismatch between them is a link error a long
    // way from its cause.
    ndkVersion = orchardNdkVersion

    packaging {
        jniLibs {
            // Local reduced build wins over the full library in the onnxruntime-android AAR.
            pickFirsts += '**/libonnxruntime.so'
        }
    }

    defaultConfig {
        applicationId = 'xyz.stuffbyren.pomelo'
        minSdk = orchardMinSdk
        targetSdk = 36
        versionCode = 20008
        versionName = '2.0.0-beta.9'
        buildConfigField 'String', 'CODENAME', '"Ensues Worryingly"'
        // Only the build that is actually published may offer updates. Every other
        // build has its own applicationId, so the published APK is neither an
        // upgrade nor installable over it.
        buildConfigField 'boolean', 'UPDATER_ENABLED', 'true'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        def tidalProps = new Properties()
        def localPropsFile = file('../local.properties')
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { tidalProps.load(it) }
        }
        def tidalClientId = System.getenv("TIDAL_CLIENT_ID") ?: tidalProps.getProperty("TIDAL_CLIENT_ID") ?: tidalProps.getProperty("tidal.clientId", "pomelo-tidal-client-id")
        def tidalClientSecret = System.getenv("TIDAL_CLIENT_SECRET") ?: tidalProps.getProperty("TIDAL_CLIENT_SECRET") ?: tidalProps.getProperty("tidal.clientSecret", "")
        buildConfigField 'String', 'TIDAL_CLIENT_ID', "\"${tidalClientId}\""
        buildConfigField 'String', 'TIDAL_CLIENT_SECRET', "\"${tidalClientSecret}\""
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir('generated/slopAssets').get().asFile
            // Reduced-op ORT for arm64; see native/onnxruntime/build.sh.
            jniLibs.srcDirs += 'native/onnxruntime'
            // Google's prebuilt LiteRT for lyric translation, shared with desktop's vendor copy.
            jniLibs.srcDirs += '../../../vendor/litert/lib/android'
        }
        canaryX86 {
            res.srcDir 'src/canary/res'
        }
        canaryFast {
            res.srcDir 'src/canary/res'
        }
        canaryFastX86 {
            res.srcDir 'src/canary/res'
        }
    }

    signingConfigs {
        if (orchardReleaseSigningReady) {
            release {
                storeFile = file(orchardReleaseKeystore)
                storePassword = orchardReleaseStorePassword
                keyAlias = orchardReleaseKeyAlias
                keyPassword = orchardReleaseKeyPassword
            }
        }
    }

    buildTypes {
        // The Android plugin owns the developer-local debug keystore.
        debug {
            // A distinct package so a debug build installs *alongside* a release one rather than
            // replacing it, and a distinct label so the two are tellable apart in the launcher.
            // Everything that derives from the application id follows automatically: the
            // FileProvider authority is declared as `${applicationId}.provider`, and UpdateManager
            // reads `context.packageName`.
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            resValue 'string', 'app_name', 'Pomelo Debug'
            buildConfigField 'boolean', 'UPDATER_ENABLED', 'false'
            ndk {
                abiFilters += orchardDebugAbis
            }
        }
        release {
            if (orchardReleaseSigningReady) signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            ndk {
                abiFilters += orchardReleaseAbis
            }
        }
        // Test builds handed out for bug reproduction. Identical to release in
        // everything that affects behaviour — same signing, same minification, so
        // it can catch the R8-only faults a debug build cannot — but it installs
        // as its own app and never offers to update itself, since the published
        // APK would neither upgrade it nor install over it.
        canary {
            initWith release
            if (!orchardReleaseSigningReady) signingConfig = signingConfigs.debug
            applicationIdSuffix = '.canary'
            versionNameSuffix = '-canary'
            buildConfigField 'boolean', 'UPDATER_ENABLED', 'false'
        }
        // Local iteration with Canary sessions and optimized native code, without R8.
        canaryFast {
            initWith canary
            debuggable = false
            jniDebuggable = false
            minifyEnabled = false
            shrinkResources = false
            versionNameSuffix = '-canary-fast'
            resValue 'string', 'app_name', 'Pomelo Canary Fast'
            matchingFallbacks = ['release']
        }
        canaryX86 {
            initWith canary
            applicationIdSuffix = '.canaryx86'
            versionNameSuffix = '-canary-x86'
            // A generated value takes priority over Canary's source-set label without
            // replacing an inherited build-type value (which AGP warns about).
            resValue 'string', 'app_name', 'Pomelo Canary x86_64'
            ndk {
                abiFilters.clear()
                abiFilters += ['x86_64']
            }
        }
        // Canary Fast for the x86_64 emulator. Shares the Canary x86_64 application ID.
        canaryFastX86 {
            initWith canaryFast
            applicationIdSuffix = '.canaryx86'
            versionNameSuffix = '-canary-fast-x86'
            resValue 'string', 'app_name', 'Pomelo Canary Fast x86_64'
            matchingFallbacks = ['release']
            ndk {
                abiFilters.clear()
                abiFilters += ['x86_64']
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
        resValues = true
        prefab = true
    }

}

kotlin {
    jvmToolchain(17)
}



gradle.taskGraph.whenReady { graph ->
    // Lint and tests inspect the release variant without publishing an APK. Keep the key check
    // for tasks that actually put a release build into someone's hands.
    def packagesRelease = graph.allTasks.any {
        it.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'installRelease'] ||
            it.name.startsWith('publishRelease')
    }
    if (packagesRelease && !orchardReleaseSigningReady) {
        throw new GradleException("Release signing environment is required for Pomelo production builds.")
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')

    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.window:window:1.5.1'

    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    implementation 'androidx.media3:media3-datasource-okhttp:1.5.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.0'
    implementation 'androidx.media3:media3-session:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'

    // TIDAL SDK modules
    implementation 'com.tidal.sdk:auth:0.11.3'
    implementation 'com.tidal.sdk:player:0.0.71'
    implementation 'com.tidal.sdk:eventproducer:0.3.2'
    implementation 'androidx.media3:media3-cast:1.5.0'

    // No release tag exists upstream yet; pin the Kawarp-AGSL commit for reproducible builds.
    implementation 'com.github.meowarex:kawarp-agsl:30715d619a'

    implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.3'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'org.jetbrains:markdown:0.7.14'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'eu.buney.kopus:kopus:1.6.1.3'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation(name: 'discord_partner_sdk', ext: 'aar')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}



tasks.register('copySlopAssets', Copy) {
    from('../../../models/slop') { include 'fakeprint_lr.f32' }
    from('../../../app/src/playback/slop_model') { include 'LICENSE' }
    into layout.buildDirectory.dir('generated/slopAssets/slop')
}
tasks.named('preBuild').configure { dependsOn 'copySlopAssets' }

// Keep local Canary iteration free of automatic release lint checks.
tasks.matching {
    (it.name.startsWith('lintVital') && it.name.contains('CanaryFast')) ||
        it.name ==~ /generateCanaryFast.*LintVitalReportModel/
}.configureEach { enabled = false }
